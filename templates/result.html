<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bass Booster - Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 1000px;
            margin-top: 20px;
        }
        .plot-img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1 class="card-title text-center">Bass Boosting Results</h1>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <h3>Time Domain</h3>
                        <div class="row">
                            <div class="col-12 mb-3">
                                <img src="{{ url_for('static', filename=time_orig) }}" alt="Original Audio (Time)" class="plot-img">
                            </div>
                            <div class="col-12 mb-3">
                                <img src="{{ url_for('static', filename=time_bass) }}" alt="Extracted Bass (Time)" class="plot-img">
                            </div>
                            <div class="col-12 mb-3">
                                <img src="{{ url_for('static', filename=time_boost) }}" alt="Bass Boosted Output (Time)" class="plot-img">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <h3>Frequency Domain</h3>
                        <div class="row">
                            <div class="col-12 mb-3">
                                <img src="{{ url_for('static', filename='images/' + orig_fft) }}" alt="Original Spectrum" class="plot-img">
                            </div>
                            <div class="col-12 mb-3">
                                <img src="{{ url_for('static', filename='images/' + bass_fft) }}" alt="Bass Spectrum" class="plot-img">
                            </div>
                            <div class="col-12 mb-3">
                                <img src="{{ url_for('static', filename='images/' + boost_fft) }}" alt="Boosted Spectrum" class="plot-img">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="text-center mt-4">
                    <a href="{{ url_for('download_file', filename=output_file) }}" class="btn btn-success btn-lg">Download Bass Boosted Audio</a>
                </div>
                <div class="text-center mt-3">
                    <a href="{{ url_for('index') }}" class="btn btn-secondary">Process Another File</a>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
