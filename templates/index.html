<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bass Booster</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 600px;
            margin-top: 50px;
        }
        .card {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1 class="card-title text-center">Bass Booster</h1>
            </div>
            <div class="card-body">
                <form action="/upload" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="file" class="form-label">Upload Audio File (WAV, FLAC, OGG, MP3)</label>
                        <input type="file" class="form-control" id="file" name="file" required>
                    </div>
                    <div class="mb-3">
                        <label for="cutoff" class="form-label">Cutoff Frequency (Hz)</label>
                        <input type="number" class="form-control" id="cutoff" name="cutoff" value="125" min="0" max="250" required>
                        <small class="form-text text-muted">Frequency below which bass is boosted.</small>
                    </div>
                    <div class="mb-3">
                        <label for="filter_order" class="form-label">Filter Order</label>
                        <input type="number" class="form-control" id="filter_order" name="filter_order" value="1000" min="1" max="3000" required>
                        <small class="form-text text-muted">Higher order gives sharper cutoff but more processing.</small>
                    </div>
                    <div class="mb-3">
                        <label for="bass_gain" class="form-label">Bass Gain</label>
                        <input type="number" step="0.1" class="form-control" id="bass_gain" name="bass_gain" value="5.0" min="0.0" max="40.0" required>
                        <small class="form-text text-muted">Multiplier for bass amplification.</small>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Boost Bass!</button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
